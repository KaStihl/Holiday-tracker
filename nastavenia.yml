# Nastavenia trackera dovoleniek – upravujte priamo na github.com (aj z mobilu: ceruzka ✏️ → Commit changes).
# Po uložení (commit do vetvy main) sa automaticky spustí nové hľadanie (Actions → Refresh), výsledok
# je v dovolenka.html o ~10–15 minút. Riadky začínajúce '#' sú len vysvetlivky.
# Pri chybe (napr. preklep v dátume) beh skončí červenou chybou s popisom, čo opraviť.

# Skupiny osôb (najviac 4) – na stránke sa medzi nimi prepína tlačidlami 👥 Osoby. Ceny závisia od počtu osôb,
# preto sa sťahujú pre každú skupinu zvlášť. Každá skupina na samostatnom riadku začínajúcom '- ':
#   nazov         = ako sa skupina volá na stránke (najviac 30 znakov), napr. "2 dospelí + 2 deti"
#   adults        = počet dospelých (1–6)
#   children_ages = vek detí počas dovolenky v rokoch (0–17), napr. [10, 12]; bez detí: []
# PRVÁ skupina je hlavná: predvolená na stránke, v týždennom e-maile a hľadá sa pre ňu najviac ponúk.
# Ďalšie skupiny: cestovky s presnými cenami (Kartago, Fischer, Ruefa, Čedok) sa pýtajú na menej ponúk
# (najlepšie destinácie), ostatné ceny sa prepočítajú z ceny za osobu (orientačne).
# Dátumy narodenia, ktoré niektoré cestovky chcú, sa odvodia z veku a z date_from.
# Príklady ďalších skupín:
#   - {nazov: "Ja + 1 dieťa", adults: 1, children_ages: [12]}
#   - {nazov: "Celá rodina", adults: 2, children_ages: [4, 10, 12]}
# (Staršie nastavenie adults: 1 a children_ages: [10, 12] namiesto skupín stále funguje – je to jedna skupina.)
skupiny:
  - {nazov: "Ja + 2 deti", adults: 1, children_ages: [10, 12]}
  - {nazov: "2 dospelí + 2 deti", adults: 2, children_ages: [10, 12]}
  - {nazov: "2 dospelí", adults: 2, children_ages: []}

# Najskorší a najneskorší deň odchodu (RRRR-MM-DD).
date_from: 2027-07-01
date_to: 2027-08-31

# Dĺžka pobytu v nociach (od – do).
nights_min: 7
nights_max: 14

# Rozpočet za celú skupinu v eurách, rovnaký pre všetky skupiny (ponuky do neho sú zvýraznené a dostanú lepšie skóre).
budget: 3000

# Strop ceny za celú skupinu v eurách – drahšie ponuky sa vôbec nezobrazia.
# Vyšší strop (napr. 6000) nechá v zozname aj vzdialené destinácie (Maldivy, Mexiko, Thajsko…).
price_cap: 6000

# Letiská odletu (IATA kódy): BTS = Bratislava, VIE = Viedeň, BUD = Budapešť, KSC = Košice, BRQ = Brno, PRG = Praha.
departures: [BTS, VIE]
# Záložné letiská – ponuky odtiaľ sa ponechajú, ale primárne sa hľadá z 'departures'.
# Z Brna (BRQ) navyše samostatne hľadajú Kartago, Fischer a Čedok (z Brna lietajú).
departures_secondary: [BUD, KSC, BRQ]

# Spôsob dopravy: flight = letecky, car = vlastným autom. Jedno alebo oboje.
transports: [flight, car]

# Počet psov, ktoré idú s vami autom. Ak je viac ako 0, pri ceste autom sa vyradia
# ubytovania, ktoré psy výslovne nepovoľujú. 0 = bez psov.
dogs: 2

# Odkiaľ sa ide autom (len pre informáciu na stránke).
car_start: Bratislava

# Preferovaná strava: UAI = Ultra All Inclusive, AI = All Inclusive, FB = plná penzia,
# HB = polpenzia, BB = raňajky, RO = bez stravy. Preferované dostanú lepšie skóre a týždenný
# e-mail ukazuje top ponuky s touto stravou. Ak je tu len AI/UAI, Kartago a Fischer hľadajú iba All Inclusive.
boards_preferred: [UAI, AI]

# Destinácie: kód krajiny: váha (1.0 = najobľúbenejšia … 0.1 = len ak je lacná).
# Hľadá sa len v krajinách z tohto zoznamu; krajinu zmažete vymazaním riadku.
# Kódy: HR Chorvátsko, TR Turecko, CY Cyprus, IT Taliansko, GR Grécko, ES Španielsko, MT Malta,
# PT Portugalsko, ME Čierna Hora, AL Albánsko, BG Bulharsko, EG Egypt, TN Tunisko, MA Maroko,
# AE Dubaj/SAE, OM Omán, JO Jordánsko, MV Maldivy, MU Maurícius, SC Seychely, LK Srí Lanka,
# TH Thajsko, ID Bali/Indonézia, VN Vietnam, TZ Zanzibar/Tanzánia, KE Keňa, CV Kapverdy,
# DO Dominikánska republika, MX Mexiko, CU Kuba.
destinations:
  # Európa
  HR: 1.0
  TR: 1.0
  CY: 1.0
  IT: 1.0
  GR: 0.95
  ES: 0.95
  MT: 0.9
  PT: 0.8
  ME: 0.8
  AL: 0.75
  BG: 0.7
  # Afrika
  EG: 0.7
  TN: 0.65
  MA: 0.6
  CV: 0.6
  TZ: 0.6
  KE: 0.55
  # Blízky východ
  AE: 0.65
  OM: 0.6
  JO: 0.55
  # Indický oceán
  MV: 0.6
  MU: 0.6
  SC: 0.55
  # Ázia
  LK: 0.6
  TH: 0.6
  ID: 0.55
  VN: 0.55
  # Karibik a Amerika
  DO: 0.6
  MX: 0.6
  CU: 0.5

# Sledované hotely – každý názov na samostatnom riadku začínajúcom '- '. Stačí časť názvu, na veľkých/malých
# písmenách a diakritike nezáleží a slová ako hotel, resort, spa či & sa ignorujú ("Sural" nájde aj
# "Hotel Süral Hotel" a "Sural Saray"). Ich ponuky sú na stránke hore v sekcii ⭐ Sledované hotely a v
# týždennom e-maile – aj keď sú drahšie ako price_cap (najviac do dvojnásobku, označené "nad strop").
# Bez sledovaných hotelov: sledovane_hotely: []
sledovane_hotely:
  - Sural
  - Royal Alhambra   # Royal Alhambra Palace, Çolaklı (Side)
  # Za názov môžete pridať @ a kód krajiny (napr. @TR), ak rovnaký názov majú hotely aj inde.
  # Hotely s vlastnými kolotočmi / lunaparkom (podľa recenzií – pred rezerváciou overiť, či sú v lete 2027 v cene):
  - Royal Dragon      # Çolaklı (Side) – sesterský hotel Royal Alhambra, kolotoče pri aquaparku
  - Long Beach Resort @TR  # Avsallar (Alanya) – aquaparky, zábavný park, zoo
  - Land of Legends   # The Land of Legends Kingdom Hotel (Belek) – vstup do zábavného parku v cene
  - Nickelodeon       # Nickelodeon Hotels & Resorts Antalya (Belek) – vstup do Land of Legends v cene
  - Granada Luxury    # Granada Luxury Belek – vlastný mini lunapark
  - Maxx Royal Belek  # Maxx Royal Belek Golf Resort – retro lunapark
  - Green Palace      # IC Hotels Green Palace (Lara) – aquapark + lunapark

# Side – hotely pri pláži (druhá záložka na stránke „🏨 Side – hotely pri pláži“): rodinné hotely v okolí Side
# blízko pláže (podľa OpenStreetMap), ceny zájazdov z cestoviek, letenky do Antalye (AYT) a výpočet „vlastného balíka“
# (letenky + ubytovanie + transfer). Celú sekciu môžete vynechať – platia hodnoty nižšie.
side_hotely:
  enabled: true                     # false = záložka sa skryje a nič z toho sa nesťahuje
  max_vzdialenost_od_plaze_m: 300   # najviac metrov od pláže (zo súradníc v OpenStreetMap), 50–1000
  # Oblasti (stačí vymazať riadok/názov): Side, Kumköy, Çolaklı, Evrenseki, Titreyengöl, Sorgun, Kızılağaç, Manavgat
  oblasti: [Side, Kumköy, Çolaklı, Evrenseki, Titreyengöl, Sorgun, Kızılağaç, Manavgat]
  # Rodinné kritériá, ktoré sa na stránke ukazujú ako odznaky a filtre:
  #   rodinna_izba = izba pre 3–4 osoby, aquapark = aquapark/tobogany, detsky_klub = detský klub/animácie,
  #   all_inclusive = All Inclusive. Neznáme ≠ nie (cestovka ani mapa to neuvádza).
  kriteria: [rodinna_izba, aquapark, detsky_klub, all_inclusive]
  # ODHAD ceny transferu letisko Antalya (AYT) → hotel v € za JEDNU cestu pre celú skupinu (spolu tam aj späť = 2×).
  # Je to len orientačná suma pre výpočet vlastného balíka – skutočnú cenu si overte (taxi/súkromný transfer).
  transfer_eur: 60
