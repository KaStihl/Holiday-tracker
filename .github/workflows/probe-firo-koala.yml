# TEMPORARY diagnostics (Firo-tour TLS, Koala robots). Delete when done.
name: Probe Firo Koala
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/probe-fk/**", ".github/workflows/probe-firo-koala.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt certifi
      - run: bash .github/probe-fk/probe.sh
