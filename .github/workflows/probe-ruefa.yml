# TEMPORARY probe for the Ruefa watch hook – prints to the job log only, deleted after use.
name: Probe Ruefa
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["probe/**"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - run: python probe/ruefa_probe.py
