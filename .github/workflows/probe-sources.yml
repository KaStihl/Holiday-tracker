# TEMPORARY diagnostics – deleted when done.
name: Probe sources
on:
  push:
    branches: [main]
    paths: ["probe/**", ".github/workflows/probe-sources.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r scraper/requirements.txt
      - run: python probe/probe.py
