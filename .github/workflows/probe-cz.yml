# TEMPORARY probe (Coral Travel, Itaka, Brno departures) – prints to the job log only, deleted after use.
name: Probe CZ
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["probe/**", ".github/workflows/probe-cz.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - run: python probe/probe_cz.py
